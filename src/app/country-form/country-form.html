<div>
    <h2>Country Details</h2>
    <button class="close-btn">X</button>
    <form [formGroup]="contactForm">
        <div class="form-group">
          <label>Country Name <span class="required">*</span></label>
          <input type="text" placeholder="Country Name" formControlName="countryName" required />
        </div>

        <div class="form-group">
          <label>Description <span class="required">*</span></label>
          <textarea rows="3" placeholder="Description" formControlName="description" required></textarea>
        </div>
    </form>

    <div class="modal-footer">
      <button class="cancel-btn">CANCEL</button>
      <button class="submit-btn">SUBMIT</button>
    </div>
</div>
