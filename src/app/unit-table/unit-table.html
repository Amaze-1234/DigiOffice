<div class="header">
    <div class="intial">
        <img src="" alt="icon">
        <p>Filter By:</p>
        <input type="text" placeholder="search">
    </div>
    <div class="addDetails">
        <button id="addButton"> <img src="images/plus.svg" alt=""> Add Job level</button>
    </div>
</div>
    
<p class="">Showing {{deptLength}} Results</p>
  <table class="table ">
             <tr>
              <th>Department Name</th>
              <th>Department Description</th>
              <th>Action</th>
            </tr>
          <tr *ngFor="let data of DepartmentData">
            <td>{{data.departmentName}}</td>
            <td>{{data.departmentDescription}}</td>
          
           <td>
           <img  class="modify"src="images/Edit 1.svg" alt="Edit" >
        <img class="modify" src="images/Delete.svg" alt="Delete" (click)="deleteDepartment(data.id)">
    
           </td>

         </tr>
      </table>
