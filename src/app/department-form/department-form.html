<form [formGroup]="departmentInfo">
    <div class="c1">
    
        <div class="row">
            <div class="col-lg-4">
                 <label> DepartmentName<span id="mark">*</span></label>
                <input type="text" placeholder="Department Name" class=" form-control" formControlName="departmentName">
            </div>
            <div class="col-lg-5" id="Description">
                 <label>Description<span id="mark">*</span></label>
                <textarea placeholder="Level Description" rows="4" cols="25" class="form-control"
                    formControlName="departmentDescription"></textarea>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-6">

            </div>

            <div class="col-lg-4" id="action-buttons">
                <button id="click-cancel" (click)="cancel()">Cancel</button>

                <button id="click-submit"
                    (click)="addDepartment(deptID?'update':'save')">{{deptID?'Update':'Submit'}}</button>
            </div>
        </div>

    </div>
</form>
