<div>
    <form [formGroup]="contactForm">
        <div class="row">
          <div class="col-lg-5">
            <label class="label1">Country Name <span class="required">*</span></label>
          </div>
          <div class="col-lg-6">
            <label class="label1">Description <span class="required">*</span></label>
          </div>
        </div>

        <div class="row">
          <div class="col-lg-5">
             <input type="text" placeholder="Country Name" formControlName="countryName" required />
          </div>
          <div class="col-lg-6">
              <textarea rows="5"  cols="30" placeholder="Description" formControlName="countryDescription" required></textarea>
          </div>
        </div>
    </form>

    <div class="button-grp">
      <button class="cancel-btn" (click)="modalservice.dismissAll()">CANCEL</button>
      <button class="submit-btn" (click)="submit(editid? 'save' : 'update')">SUBMIT</button>
    </div>
</div>
