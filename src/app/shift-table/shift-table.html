

<div class="container  mt-3">
<button (click)="openModal(popupmodal)" class="shifting btn   px-3 text-white mb-4">
  <img src="images/plus.svg" alt="+logo">Add Shift</button>

<table >
  <tr class="border-bottom">
    <!-- <th>Shift ID</th> -->
    <th>Shift Type</th>
    <th>Start Time</th>
    <th>End Time</th>
    <th>Shift Code</th>
    <th>Grace Period</th>
    <th >Actions</th>
   
  </tr>
  <tr *ngFor = "let s of shiftData" class="border-bottom">
    <!-- <td>{{s.ID}}</td> -->
    <td>{{s.shiftType}}</td>
    <td>{{s.startTime}}</td>
    <td>{{s.endTime}}</td>
    <td>{{s.shiftCode}}</td>
     <td>{{s.gracePeriod}}</td>

  <td class=""><button (click)="openModal(popupmodal,s.ID)" class="btn  me-1 "> <img src="images/Edit 1.svg"  class="img-fluid" style="width: 25px; height: auto;" alt="edit"></button>

    <button (click)="delete(s.ID)" class="btn "><img src="images/Delete.svg" alt="delte" class="img-fluid" style="width: 25px; height: auto;"></button></td>
 
  </tr>

  </table>
  </div>

<ng-template #popupmodal let-modal>
    <div class="modal-header justify-content-between">
        <h5>Shift Master</h5>
        <span style="font-size: 25px;" (click)="modal.dismiss()"><img src="images/close.png"  class="img-fluid" style="width: 25px; height: auto;" alt="close"></span>
    </div>
    <div class="modal-body">
        <app-shift-form [editid]="editid" (closemodal)="close($event)"></app-shift-form>
    </div>
    <div class="modal-footer">
        <button (click)="close()" class="btn px-5 text-primary btn-outline-primary fw-bold">Cancel</button>
                <button (click)="onSubmit(editid?'update':'submit')" class="btn px-5 text-white bg-primary fw-bold">{{editid?'Update':'Submit'}}</button>

    </div>
</ng-template>
