<div class="announcement-form">
    <form [formGroup]="contactForm">
        <div class="row">
            <div class="col-lg-4">
                <label for="">Announcement Date<span class="required">*</span></label>
                <input type="date" formControlName="Date" placeholder="dd-mm-yyyy" class="form-control">
            </div>
            <div class="col-lg-4">
                <label for="">Announcement time<span class="required">*</span></label>
                <input type="time" formControlName="Time" class="form-control">
            </div>
            <div class="col-lg-4">
                <label for="">Announcement<span class="required">*</span></label>
                <input type="text" formControlName="Text" class="form-control">
            </div>
        </div>
        <div class="row" style="margin-top: 20px;">
             <div class="col-lg-4">
                <label for="">Supporting Document</label>
                <textarea style="border: 2px dashed;" formControlName="Images" class="form-control" cols="30" rows="6" 
                placeholder="Drop Files Here" ></textarea>
            </div>
            <div class="col-lg-5">
                <textarea class="form-control" formControlName="Textfield" cols="25" rows="10" placeholder="Enter text here..."></textarea>
            </div>
        </div>
        <div class="button-grp">
            <button type="submit" class="cancel-btn" (click)="modalservice.dismissAll()">Cancel</button>
            <button type="submit" class="submit-btn" [disabled]="contactForm.invalid" (click)="submit()">Submit</button>
        </div>
    </form>
</div>
