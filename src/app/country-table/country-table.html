<div class="row" style="margin: 10px;">
    <div style="margin: 5px;" >
        <button class="btn btn-primary b1" (click)="openModal(popupModal)"><i class="fa-solid fa-circle-plus"></i> Add country</button>
    </div>
    <table>
        <tr>
            <th>Country</th>
            <th>CountryDescription</th>
            <th>Actions</th>
        </tr>
        <tr *ngFor="let data of countryData">
            <td>{{data.countryName}}</td>
            <td>{{data.countryDescription}}</td>
            <td style="font-size: large;color: blue;">
                <i class="fa-solid fa-pen-to-square" (click)="openModal(popupModal,data.id)"></i>
                <i class="fa-solid fa-trash" (click)="delete(data.id)"></i>
            </td>
        </tr>
    </table>
</div>


<ng-template #popupModal let-Modal>
    <div class="modal-header">
        <h3>Country Details</h3>
        <button (click)="Modal.dismiss();">X</button>
    </div>
    <div class="modal-body">
        <app-country-form  [editid] = 'editid' (closeModal)="close($event)"></app-country-form>
    </div>
</ng-template>
