<div class="container">
  <form [formGroup]="loanForm">

    <div class="row">
      <div class="col-4">
        <label>LoanType<span class="text-danger fw-bold">*</span></label>
        <input type="text" name="loan type" formControlName="loanType" placeholder="LoanType" class="form-control mt-1">
      </div>
      <div class="col-6">
        <label>Description<span class="text-danger fw-bold">*</span></label>
        <textarea rows="4" cols="50" formControlName="loanDescription" placeholder="Description"
          class="form-control mt-1"></textarea>
      </div>
    </div>

    <div class="footing mt-3">
      <button (click)="modalservice.dismissAll()"
        class="btn px-5 text-primary btn-outline-primary fw-bold me-4">Cancel</button>

      <button [disabled]="loanForm.invalid" (click)="onSubmit(editid?'update':'submit')"
        class="btn px-5 text-white bg-primary fw-bold">{{editid?'Update':'Submit'}}</button>

    </div>
  </form>
</div>
