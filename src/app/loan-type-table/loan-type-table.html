

<div class="container  mt-5">
<button (click)="openModal(popupmodal)" class="btn bg-success fw-bold px-2 text-white mb-4">Add Loan Type</button>

<table class="text-center">
  <tr>
    <th>Loan ID</th>
    <th>Loan Type</th>
    <th>Loan Description</th>
    <th>Actions</th>
   
  </tr>
  <tr *ngFor = "let l of loanData">
    <td>{{l.ID}}</td>
    <td>{{l.loanType}}</td>
    <td>{{l.loanDescription}}</td>
  

  <td><button (click)="openModal(popupmodal,l.ID)" class="btn bg-warning text-dark fw-bold pt-1 pb-1 me-2 my-1">Update</button>

    <button (click)="delete(l.ID)" class="btn bg-dark text-white fw-bold pt-1 pb-1">Delete</button></td>
 
  </tr>

  </table>
  </div>

<ng-template #popupmodal let-modal>
    <div class="modal-header justify-content-between">
        <h1>Loan Master Form</h1>
        <span style="font-size: 25px;" (click)="modal.dismiss()">X</span>
    </div>
    <div class="modal-body">
        <app-loan-type-form [editid]="editid" (closemodal)="close($event)"></app-loan-type-form>
    </div>
    <div class="modal-footer">
        <button (click)="close()" class="btn btn-danger fw-bold px-2">Cancel</button>
    </div>
</ng-template>
