<div id="main">
    <div class="attendance">
        <div class="filter" style="width: 400px;">
            <img src="images/filter.png" alt="filter" width="18px">
            <p id="fil" style="color: darkgreen;">Filter&nbsp;by:</p>

            <input type="date" class="form-control" style="  border: 1px solid black;" >
        </div>
        <div class="buttonelement">
            <button class="btn btn-primary" style="width: 300px;"><img src="images/plus.svg" alt="+logo"> Add Holiday</button>
        </div>
    </div>
    <div class="tabs" >
        <button class="tablink rounded-start" [class.active]="selectedTab == 'Upcoming'"
            (click)="selectTab('Upcoming')">Upcoming</button>
        <button class="tablink" [class.active]="selectedTab == 'Ongoing'"
            (click)="selectTab('Ongoing')">Ongoing</button>
        <button class="tablink rounded-end" [class.active]="selectedTab == 'Completed'"
            (click)="selectTab('Completed')">Completed</button>
    </div>
    <div *ngIf="selectedTab == 'Upcoming'">
        <br>
        <h5>Showing 0 Results</h5>
        <br>
        <div class="row" style="background-color: white;padding: 3px;">
            <table>
                <tr>
                    <th>Holiday</th>
                    <th>Holiday Description</th>
                    <th>Holiday Date</th>
                    <th>Attachment</th>
                    <th>Actions</th>
                </tr>
            </table>
        </div>
    </div>
    <div *ngIf="selectedTab == 'Ongoing'">
        <br>
        <h5>Showing 0 Results</h5>
        <br>
        <div class="row" style="background-color: white;padding: 3px;">
            <table>
                <tr>
                    <th>Holiday</th>
                    <th>Holiday Description</th>
                    <th>Holiday Date</th>
                    <th>Attachment</th>
                    <th>Actions</th>
                </tr>
            </table>
        </div>
    </div>
    <div *ngIf="selectedTab == 'Completed'">
        <br>
        <h5>Showing 0 Results</h5>
        <br>
        <div class="row" style="background-color: white;padding: 3px;">
            <table>
                <tr>
                    <th>Holiday</th>
                    <th>Holiday Description</th>
                    <th>Holiday Date</th>
                    <th>Attachment</th>
                </tr>
            </table>
        </div>
    </div>
</div>
