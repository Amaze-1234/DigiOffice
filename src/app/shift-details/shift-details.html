<div class="header">
 <div class="resigantion-tab">
    <p class="text"(click)="myShift()">My Shift</p>
    <span class="downbar"  [ngClass]="{'show': action=='myShift'}"></span>
 </div>
 <div class="team-resignation">
    <p class="text" (click)="myTeamShift()">My Team Shift</p>
       <span class="downbar" [ngClass]="{'show': action=='myTeamShift'}"></span>
 </div>

</div>


<div class="card">
  <div class="card-body">
    <div class="intial">
      <img src="images/filter.png" alt="icon" width="18px" height="18px">
      <p id="filter-text">Filter By:</p>
      <input type="date" placeholder="Start Date" style="padding:6px;" class="form-control">
      <input type="date" placeholder="End Date" style="padding:6px;" class="form-control">
    </div>
    <div class="addDetails">
      <button class="addButton"> <img src="images/plus.svg" width="15px"> Add Shift Details
      </button>
    </div>
  </div>
</div>


<div *ngIf="action=='myShift'">

</div>

<div *ngIf="action=='myTeamShift'">
 <app-team-shift-details></app-team-shift-details>
</div>
