<div class="container fw-bold bg-info ps-4 pt-2 pb-2 mt-5 text-white">
  <h3 class="text-white">Loan Master Form</h3>
  <form [formGroup]="loanForm">
 
<div class="row">
    <div class="col-3">
    <label>Loan Type*</label>
<input type="text" name="loan type"  formControlName="loanType">
    </div>
    <div class="col-3">
        <label>Description **</label>
        <textarea row="3" cols="30" formControlName="loanDescription"></textarea>
    </div>
</div>




  

      <div class="">
        <button (click)="onSubmit(editid?'Update':'Submit')" class="btn btn-success px-2 fw-bold">{{editid?'Update':'Submit'}}</button>
      </div>
  
  </form>
</div>
