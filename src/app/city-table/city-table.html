
<div >
    <br>
    <div class="row first" >
        <div class="col-3">
            <img src="images/filter.png" alt="icon"  style="width:25px;height:25px;">

            <p>Filter By:</p>
            <input type="text" placeholder="Search..." class=" form-control searchBar" >
        </div>
        <div class="col">
            <button type="submit" (click)="openModel(popup)"  class="shifting btn   px-3 text-white mb-4" ><img src="images/plus.svg" alt="+logo">   Add City</button>
        </div>

    </div><br>
   <h4 class="records" style="color: blue;">Showing {{deptLength}} Results</h4>
  <div class="row " style="background-color: white;margin:0 2px;">
        <div class="col-lg-12">
            <table>
                <tr>
    
                    <th>Country</th>
                    <th>Province</th>
                    <th>City Name</th>
                    <th>City Description</th>
                    <th>Actions</th>
                    
                </tr>
                <tr *ngFor="let data of CityData">
               
                    <td>{{data.countryName}}</td>
                    <td>{{data.provinceName}}</td>
                    <td>{{data.city}}</td>
                    <td>{{data.description}}</td>
                    

                    <td ><button class="btn " (click)="openModel(popup,data.id)"><img src="images/Edit 1.svg"  class="img-fluid" style="width: 25px; height: auto;" alt="edit"></button>
                       <button class="btn " (click)="deleteCity(data.id)" ><img src="images/Delete.svg" alt="delte" class="img-fluid" style="width: 25px; height: auto;"></button>
                    
                    </td>
                   
                </tr>
            </table>
        </div>
    </div>
</div>

<ng-template #popup let-Model>
    <div class="modal-header d-flex justify-content-between ">
        <h3>City Masters</h3> 
        <span (click)="Model.dismiss();editid=null" ><img src="images/close.png" alt="close.png"></span>
    
    </div>
    <div class="modal-body">
       <app-city-form [editid]="editid" (closemodal)="close($event)"> </app-city-form>
    </div>
</ng-template>
