
<div class="jobLevel">
    <div class="header">
        <div class="intial">
            <img src="images/filter.png" alt="icon" class="filterImage">

            <p>Filter By:</p>
            <input type="text" placeholder="Search..." class=" form-control searchBar">
        </div>
        <div class="addDetails">
            <button id="addButton" class="addBtn" (click)="openModal(popupModal)"> <img src="images/plus.svg" alt="filter"
                    class="filterImage "> Add Job Level
            </button>
        </div>
    </div>
    <p class="para">Showing</p>
    <div class="row tableData" >
        <table id="tableData">
            <tr>
                <th>Designation</th>
                <th>Level Type</th>
                <th>Level Description</th>
                <th>Actions</th>
            </tr>
            <tr *ngFor="let data of jobLevelShift">
                <td>{{data.title}}</td>
                <td>{{data.levelType}}</td>
                <td>{{data.levelDescription}}</td>
                <td><img src="images/Edit 1.svg" alt="Edit" (click) = "openModal(popupModal,data.id)">
                    <img src="images/Delete.svg" alt="Delete" (click) = "delete(data.id)">
                </td>
            </tr>
        </table>
    </div>
</div>

<ng-template #popupModal>
    <div class="modal-header display-flex justify-content-between" >
        <h5>Job Level Master</h5>
        <img src="images/close.png" alt="close" (click) ="close()" >
    </div>
    <div class="modal-body">
        <app-job-level-type-form [editID] = "editID" (closemodal) = "close($event)"></app-job-level-type-form>
    </div>
</ng-template>
