<div class="attendance-card" >
    <h3 class="title">Attendance Tracker</h3>
    <p>{{ currentTime | date:'shortTime' }}</p>
    <p>{{ currentTime | date:'MM-dd-yyyy' }}</p>

    <div>
        <label class="label">Work Type Details</label>
        <select  class="form-control" >
            <option >Select Type</option>
            <option>Office</option>
        </select>
    </div>

    <div class="mt-4">
        <button class="action-btn "  
            (click)="confirmPunchIn()" >Punch In</button>
    </div>

    <div style="margin-top: 20px;">
        <button class="punchIn-btn">
            <span [ngStyle]="{ color: punchInTime ? 'black' : '' }">
                {{ punchInTime ? 'Punched In at ' + (punchInTime) : 'No Punch In yet' }}
            </span>
        </button>
    </div>

    <div style="margin-top: 20px;">
        <button class="punchOut-btn" [disabled]="!punchInTime"
            [ngClass]="punchInTime ? 'punchout-active' : 'punchOut-btn'" (click)="confirmPunchOut()" >
            Punch Out
        </button>
    </div>

    <div style="margin-top: 20px;">
        <button class="action-btn">
            <span [ngStyle]="{ color: punchOutTime ? 'black' : ''}">
                {{ punchOutTime ? 'Punched Out at ' + (punchOutTime) : 'No Punch Out yet' }}
            </span>
        </button>
    </div>
</div>
