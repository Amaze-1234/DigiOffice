<div class="r1">
    <div class="c1 ">
        <img src="images/filter.png" alt="filter">
        <p>Filter&nbsp;by:</p>
        <input type="search" class="form-control" placeholder="Search...">
    </div>
    <div class="c2">
        <select class="form-control">
            <option value="">Select Designation</option>
            <option *ngFor="let data of designationData"   value="data.id">{{data.title}}</option>
          
        </select>
    </div>
    <div class="c3">
        <select class="form-control">
            <option value="">Select Level</option>
        </select>
    </div>
    <div class="c4">
        <button (click) = "navigateToEmployeeDetails()" ><img src="images/plus.svg" alt=""> Add Staff</button>
    </div>
</div>
