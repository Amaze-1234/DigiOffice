
<div class="provincetable">
    <div class="header">
        <div class="content">
            <img src="images/filter.png" alt="icon" class="filterImage">

            <p style="margin-top: 10px;">Filter By:</p>
            <input type="text" placeholder="Search..." class=" form-control searchBar" [(ngModel)]="searchText">
        </div>

        <div style="margin: 5px;" >
            <button class="add-btn" (click)="openModal(popupModal)"><i class="fa-solid fa-circle-plus"></i> Add Province</button>
        </div>
    </div>
    <p class="result">Showing {{(provinceData |search:searchText).length}} Results</p>
        <table>
            <tr>
                <th>Country Name</th>
                <th>Province Name</th>
                <th>Province Description</th>
                <th>Actions</th>
            </tr>
            <tr *ngFor="let data of provinceData | search:searchText">
                <td>{{data.countryName}}</td>
                <td>{{data.provinceName}}</td>
                <td>{{data.provinceDescription}}</td>
                <td style="font-size: large;color: blue;">
                    <img src="images/Edit 1.svg" alt="edit-image" class="edit-btn" (click)="openModal(popupModal,data.id)">
                    <img src="images/Delete.svg" alt="delete-image"  class="delete-btn" (click)="deleteProvince(data.id)">
                </td>
            </tr>
        </table>
</div>

<ng-template #popupModal let-Modal>
    <div class="modal-header">
        <h3>Province Master Form</h3>
        <img src="images/close.png" alt="close" (click)="Modal.dismiss(); editid = null">
    </div>
    <div class="modal-body">
        <app-province-form [editid] = 'editid' (closeModal)="close($event)"></app-province-form>
    </div>
</ng-template>
