<div>
    <form>
        <div class="row">
            <div class="col-lg-4">
                <label for="">Select Loan Type<span class="required">*</span></label>
                <select class="form-control">
                    <option value="" disabled selected>Select Loan Type</option>
                    <option value="HDMF salary loan">HDMF salary loan</option>
                </select>
            </div>
            <div class="col-lg-4">
                <label for="">Total Loan Amount<span class="required">*</span></label>
                <input type="text" class="form-control">
            </div>
            <div class="col-lg-4">
                <label for="">Select Pay Period<span class="required">*</span></label>
                <select class="form-control">
                    <option value="" disabled selected>Select Pay period</option>
                    <option value="6">6</option>
                    <option value="12">12</option>
                    <option value="24">24</option>
                </select>
            </div>
        </div>
        <div class="row" style="margin-top: 18px;">
            <div class="col-lg-4">
                <label for="">Comments</label>
                <textarea class="form-control" cols="30" rows="3" placeholder="Comments"></textarea>
            </div>
        </div>
        <div class="button-grp">
            <button type="submit" class="cancel-btn">Cancel</button>
            <button type="submit" class="submit-btn">Submit</button>
        </div>
    </form>
</div>
