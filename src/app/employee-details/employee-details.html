<div>
    <form>
        <div class="card">
            <div class="card-body">
                <h5 style="text-align: center;">My Information</h5>


                <div class="row ">
                    <div class="col-lg-3">
                        <img src="images/user.png" alt="" width="180px" height="180px">
                    </div>
                    <div class="col-9">
                        <div class="row">
                            <div class="col-lg-4">
                            <label>Title <span class="required">*</span></label>
                            <select class="form-control">
                                <option value="" disabled>Select Item</option>
                                <option *ngFor="let title of titleList" value="title">{{title.value}}</option>
                            </select>
                        </div>
                        <div class="col-lg-4">
                            <label>First Name <span class="required">*</span></label>
                            <input type="text" placeholder="First Name" class="form-control">
                        </div>
                        <div class="col-lg-4">
                            <label>Middle Name <span class="required">*</span></label>
                            <input type="text" placeholder="Middle Name" class="form-control">
                        </div>
                        </div>
                        <div class="row">
                            <div class="col-lg-4">
                            <label>Last Name <span class="required">*</span></label>
                            <input type="text" placeholder="Last Name " class="form-control">
                        </div>
                        <div class="col-lg-4">
                            <label>Nick Name <span class="required">*</span></label>
                            <input type="text" placeholder="Nick Name" class="form-control">
                        </div>
                        <div class="col-lg-4">
                            <label>Date of Birth <span class="required">*</span></label>
                            <input type="text" placeholder="Date of Birth" class="form-control">
                        </div>
                        </div>
                        <div class="row">
                            <div class="col-lg-4">
                            <label>Place of Birth<span class="required">*</span></label>
                            <input type="text" placeholder="Place of Birth" class="form-control">
                        </div>
                        <div class="col-lg-4">
                            <label>Country of Birth <span class="required">*</span></label>
                            <input type="text" placeholder="Nick Name" class="form-control">
                        </div>
                        <div class="col-lg-4">
                            <label>Gender <span class="required">*</span></label><br>
                            <input type="radio" id="Gender" name="Gender" value="Male">Male
                            <input type="radio" id="Gender" name="Gender" value="Female">Female
                        </div>
                        </div>
                        <div class="row">
                             <div class="col-lg-4">
                            <label>Marital Status <span class="required">*</span></label>
                            <input type="text" placeholder=" Select Marital Status " class="form-control">
                        </div>
                        <div class="col-lg-4">
                            <label>Personal Email <span class="required">*</span></label>
                            <input type="text" placeholder="Personal Email" class="form-control">
                        </div>
                        <div class="col-lg-4">
                            <label>Mother Name<span class="required">*</span></label>
                            <input type="text" placeholder="Mother Name" class="form-control">
                        </div>
                        </div>
                        <div class="row">
                             <div class="col-lg-4">
                            <label>Father Name<span class="required">*</span></label>
                            <input type="text" placeholder="Father Name" class="form-control">
                        </div>
                        </div>

                    </div>

                </div>
            </div>
        </div>
        <div class="card">
            <div class="card-body">
                <h6>Ethnicity Information</h6>
                <div class="row">
                    <div class="col-lg-3">
                        <label>Religion <span class="required">*</span></label>
                        <select class="form-control">
                            <option value="" disabled>Select Religion</option>
                            <option value="Hinduism">Hinduism</option>
                            <option value="Buddism">Buddism</option>
                            <option value="Christianity">Christianity</option>
                            <option value="Islam">Islam</option>
                            <option value="Judism">Judism</option>
                        </select>
                    </div>
                    <div class="col-lg-3">
                        <label>Citizenship <span class="required">*</span></label>
                        <select class="form-control">
                            <option value="" disabled>Select Citizenship</option>
                            <option value="Indian">Indian</option>
                            <option value="Japanese">Japanese</option>
                            <option value="Korean">Korean</option>
                            <option value="British">British</option>
                            <option value="Austrian">Austrian</option>
                        </select>
                    </div>
                    <div class="col-lg-3">
                        <label>Nationality <span class="required">*</span></label>
                        <select class="form-control">
                            <option value="" disabled>Select Nationality</option>
                            <option value="Indian">Indian</option>
                            <option value="Japanese">Japanese</option>
                            <option value="Korean">Korean</option>
                            <option value="British">British</option>
                            <option value="Austrian">Austrian</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="card-body">
                <h6>Health Information</h6>
                <div class="col-lg-3">
                    <label>Blood Type <span class="required">*</span></label>
                    <input type="text" placeholder="Blood Type" class="form-control">
                </div>
            </div>
        </div>
    </form>
</div>
