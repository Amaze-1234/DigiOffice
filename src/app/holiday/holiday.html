<div class="attendance">
    <div class="filter">
        <img src="images/filter.png" alt="filter" width="18px">
        <p id="fil">Filter&nbsp;by:</p>

        <input type="date" class="form-control" style="  border: 1px solid black;">
    </div>
    <div class="buttonelement">
        <button class="btn btn-primary"><img src="images/plus.svg" alt="+logo"> Add Holiday</button>
    </div>
</div>
<div class="tabs">
            <button class="tablink rounded-start" [class.active]="selectedTab == 'pending'"
                (click)="selectTab('pending')">Pending</button>
            <button class="tablink" [class.active]="selectedTab == 'approved'"
                (click)="selectTab('approved')">Approved</button>
            <button class="tablink rounded-end" [class.active]="selectedTab == 'rejected'"
                (click)="selectTab('rejected')">Rejected</button>
        </div>
        <div *ngIf="selectedTab == 'pending'">
            <br>
            <h5>Showing 0 Results</h5>
            <br>
            <div class="row" style="background-color: white;padding: 3px;">
                <table>
                    <tr>
                        <th>Date</th>
                        <th>Start Time</th>
                        <th>End Time</th>
                        <th>Status</th>
                        <th>Comments</th>
                        <th>Reason</th>
                    </tr>
                </table>
            </div>
        </div>
        <div *ngIf="selectedTab == 'approved'">
            <br>
            <h5>Showing 0 Results</h5>
            <br>
            <div class="row" style="background-color: white;padding: 3px;">
                <table>
                    <tr>
                        <th>Date</th>
                        <th>Start Time</th>
                        <th>End Time</th>
                        <th>Status</th>
                        <th>Comments</th>

                    </tr>
                </table>
            </div>
        </div>
        <div *ngIf="selectedTab == 'rejected'">
            <br>
            <h5>Showing 0 Results</h5>
            <br>
            <div class="row" style="background-color: white;padding: 3px;">
                <table>
                    <tr>
                        <th>Date</th>
                        <th>Start Time</th>
                        <th>End Time</th>
                        <th>Status</th>
                        <th>Comments</th>
                        <th>Reason</th>
                    </tr>
                </table>
            </div>
        </div>
