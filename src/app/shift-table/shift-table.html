

<div class="container mt-3">
  <div class="mb-2 pt-1 pb-1  bg-white ps-1 h-cover d-flex align-items-start justify-content-between">
  <div class="d-inline-flex align-items-center mt-1">
    <img src="images/filter.png" alt="filter" class="img-fluid me-1" width="20px">
    <span class="fw-bold me-4" style="color:darkolivegreen">Filter by:</span>
    <input type="search" class="" placeholder="Search..." class="">
  </div>
  <button (click)="openModal(popupmodal)" class="shifting btn px-4 text-white me-2 mt-1 mb-1">
    <img src="images/plus.svg" alt="+logo" class="text-center me-1 mt-0">Add Shift
  </button>
</div>
  <div>
  <h5 class="text-start" style="color:blue;">Showing {{shiftLength}} Results</h5>
  </div>
  <div class="bg-white ps-1 pe-1 rounded">
<table class="table w-100" style="table-layout: fixed;">
  <tr class="border-bottom">
  
    <th>Shift Type</th>
    <th>Start Time</th>
    <th>End Time</th>
    <th>Shift Code</th>
    <th>Grace Period</th>
    <th class="text-center">Actions</th>
   
  </tr>
  <tr *ngFor = "let s of shiftData" class="border-bottom">
 
    <td>{{s.shiftType}}</td>
    <td>{{s.startTime}}</td>
    <td>{{s.endTime}}</td>
    <td>{{s.shiftCode}}</td>
     <td>{{s.gracePeriod}}</td>

  <td class="text-center"><button (click)="openModal(popupmodal,s.id)" class="btn  me-1 "> <img src="images/Edit 1.svg"  class="img-fluid" style="width: 25px; height: auto;" alt="edited image"></button>

    <button (click)="delete(s.id)" class="btn "><img src="images/Delete.svg" alt="deleted image" class="img-fluid" style="width: 25px; height: auto;"></button></td>
 
  </tr>

  </table>
  </div>
  </div>

<ng-template #popupmodal let-modal>
    <div class="modal-header justify-content-between">
        <h5>Shift Master</h5>
        <span style="font-size: 25px;" (click)="close()"><img src="images/close.png"  class="img-fluid" style="width: 25px; height: auto;" alt="close"></span>
    </div>
    <div class="modal-body">
        <app-shift-form [editid]="editid" (closemodal)="close($event)"></app-shift-form>
    </div>    
</ng-template>
