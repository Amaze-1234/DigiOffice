<div class="container fw-bold bg-info ps-4 pt-2 pb-2 mt-5 text-white">
  <h3 class="text-white">Shift Master</h3>
  <form [formGroup]="shiftForm">
 
<div class="row">
    <div class="col-3">
    <label>Shift Type*</label>
    <select class="form-control" formControlName="shiftType">
<option value="" selected disabled>Select Shift</option>
<option>Morning Shift</option>
<option>Afternoon Shift</option>
<option value="">Evening Shift</option>
<option value="">Midnight Shift</option>
    </select>
    </div>
    <div class="col-3">
    <label>Start Time*</label>
<input type="time" name="starttime"  formControlName="startTime">
    </div>
    <div class="col-3">
        <label>End Time*</label>
<input type="time" name="endtime"  formControlName="endTime">
    </div>
</div>

<div class="row">
<div class="col-3">
     <label>Shift Code*</label>
<input type="text" name="shiftcode"  formControlName="shiftCode">
</div>
<div class="col-3">
     <label>Grace Period*</label>
<input type="number" name="graceperiod"  formControlName="gracePeriod">
</div>
</div>


  

      <div class="">
        <button (click)="onSubmit(editid?'Update':'Submit')" class="btn btn-success px-2 fw-bold">{{editid?'Update':'Submit'}}</button>
      </div>
  
  </form>
</div>
