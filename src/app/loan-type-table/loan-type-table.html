

  <div class="container  mt-3">
  <div class="mb-2 pt-1 pb-1  bg-white ps-1 h-cover d-flex align-items-start justify-content-between">
  <div class="d-inline-flex align-items-center mt-1">
    <img src="images/filter.png" alt="filter" class="img-fluid me-1" width="20px">
    <span class="fw-bold me-3" style="color:darkolivegreen ">Filter by:</span>
    <input type="search" placeholder="Search..." class="">
  </div>
  <button (click)="openModal(popupmodal)" class="shifting btn px-5 text-white me-2 mt-1 mb-1">
    <img src="images/plus.svg" alt="+logo" class="text-center me-1 mt-0">Add Loan Type
  </button>
</div>
 <div>
  <h5 class="text-start" style="color:blue;">Showing {{loanData.length}} Results</h5>
  </div>
  <div class="bg-white ps-1 pe-1 rounded">
<table class="table w-100" style="table-layout: fixed;">
  <tr class="border-bottom">

    <th>Loan Type</th>
    <th >Loan Description</th>
    <th class="text-center">Actions</th>
   
  </tr>
  <tr *ngFor = "let l of loanData" class="border-bottom">
   
    <td>{{l.loanType}}</td>
    <td>{{l.loanDescription}}</td>
  

  <td class="text-center"><button (click)="openModal(popupmodal,l.id)" class="btn  me-1 "> <img src="images/Edit 1.svg"  class="img-fluid" style="width: 25px; height: auto;" alt="edited image"></button>

    <button (click)="delete(l.id)" class="btn "><img src="images/Delete.svg" alt="deleted image" class="img-fluid" style="width: 25px; height: auto;"></button></td>
 
  </tr>

  </table>
  </div>

<ng-template #popupmodal let-modal>
    <div class="modal-header justify-content-between">
        <h5>Loan Master Form</h5>
        <span style="font-size: 25px;" (click)="close()"><img src="images/close.png"  class="img-fluid" style="width: 25px; height: auto;" alt="close"></span>
    </div>
    <div class="modal-body">
        <app-loan-type-form [editid]="editid" (closemodal)="close($event)"></app-loan-type-form>
    </div>
    <div class="modal-footer">
    </div>
</ng-template>
