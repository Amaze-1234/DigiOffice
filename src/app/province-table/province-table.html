
<div class="row" style="margin: 10px;">
    <div style="margin: 5px;" >
        <button class="btn btn-primary b1" (click)="openModal(popupModal)"><i class="fa-solid fa-circle-plus"></i> Add Province</button>
    </div>
    <table>
        <tr>
            <th>Province Name</th>
            <th>Province Description</th>
            <th>Actions</th>
        </tr>
        <tr *ngFor="let data of provinceData">
            <td>{{data.provinceName}}</td>
            <td>{{data.provinceDescription}}</td>
            <td style="font-size: large;color: blue;">
                <i class="fa-solid fa-pen-to-square" (click)="openModal(popupModal,data.id)"></i>
                <i class="fa-solid fa-trash" (click)="delete(data.id)"></i>
            </td>
        </tr>
    </table>
</div>

<ng-template #popupModal let-Modal>
    <div class="modal-header">
        <h3>Province Master Form</h3>
        <button (click)="Modal.dismiss();">X</button>
    </div>
    <div class="modal-body">
        <app-province-form [editid] = 'editid' (closeModal)="close($event)"></app-province-form>
    </div>
</ng-template>
