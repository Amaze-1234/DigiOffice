<div class="countrytable">
    <div class="header">
        <div class="content">
            <img src="images/filter.png" alt="icon" class="filterImage">

            <p style="margin-top: 10px;">Filter By:</p>
            <input type="text" placeholder="Search..." class=" form-control searchBar">
        </div>

        <div style="margin: 5px;" >
            <button class="add-btn" (click)="openModal(popupModal)"><i class="fa-solid fa-circle-plus"></i> Add country</button>
        </div>
    </div>
    <p class="result">Showing</p>
    <div class="row tableData">
        <table>    
            <tr>
                <th>Country</th>
                <th>CountryDescription</th>
                <th>Actions</th>
            </tr>
            <tr *ngFor="let data of countryData">
                <td>{{data.countryName}}</td>
                <td>{{data.countryDescription}}</td>
                <td style="font-size: large;color: blue;">
                    <i class="fa-solid fa-pen-to-square" (click)="openModal(popupModal,data.id)"></i>
                    <i class="fa-solid fa-trash" (click)="delete(data.id)"></i>
                </td>
            </tr>
        </table>
    </div>
</div>


<ng-template #popupModal let-Modal>
    <div class="modal-header">
        <h3>Country Details</h3>

        <img src="images/close.png" alt="close" (click)="Modal.dismiss();">

    </div>
    <div class="modal-body">
        <app-country-form  [editid] = 'editid' (closeModal)="close($event)"></app-country-form>
    </div>
</ng-template>
