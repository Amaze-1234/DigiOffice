<div class="announcement-form">
    <form>
        <div class="row">
            <div class="col-lg-4">
                <label for="">Announcement Date<span class="required">*</span></label>
                <input type="date" id="date" placeholder="dd-mm-yyyy" class="form-control">
            </div>
            <div class="col-lg-4">
                <label for="">Announcement time<span class="required">*</span></label>
                <input type="time" id="time" class="form-control">
            </div>
            <div class="col-lg-4">
                <label for="">Announcement<span class="required">*</span></label>
                <input type="text" class="form-control">
            </div>
        </div>
        <div class="row" style="margin-top: 20px;">
             <div class="col-lg-4">
                <label for="">Supporting Document</label>
                <textarea style="border: 2px dashed;" class="form-control" cols="30" rows="6" placeholder="Drop Files Here"></textarea>
            </div>
        </div>
        <div class="button-grp">
            <button type="submit" class="cancel-btn">Cancel</button>
            <button type="submit" class="submit-btn">Submit</button>
        </div>
    </form>
</div>
