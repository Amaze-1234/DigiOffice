 <form [formGroup]="departmentInfo">
<div class="c1">
    <div class="row">
        <div class="col-lg-4">
            <label> DepartmentName<span id="mark">*</span></label>
        </div>
       
        <div class="col-lg-5">
            <label>Description<span id="mark">*</span></label>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-4">
        
            <input type="text" placeholder="Department Name" formControlName="departmentName">
        </div>
        <div class="col-lg-5">
            <textarea placeholder="Level Description" rows="4" formControlName="departmentDescription"></textarea>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-8">
            
        </div>
       
        <div class="col-lg-2">
            <button id="click-cancel">Cancel</button>
        </div>
        <div class="col-lg-2">
             <button id="click-submit"(click)="addDepartment()" >Submit</button>
        </div>
    </div>

    </div>
    </form>
