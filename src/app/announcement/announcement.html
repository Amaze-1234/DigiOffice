<div class="header">
    <div class="content">
        <img src="images/filter.png" alt="icon" class="filterImage">
        <p style="margin-top: 14px; color: rgb(6, 71, 6);">Filter By:</p>
        <input type="date" id="date" placeholder="dd-mm-yyyy/dd-mm-yyyy" class=" form-control searchbar">
    </div>
    <div style="margin-top: 8px;">
        <button class="add-btn"><i class="fa-solid fa-circle-plus"></i>
            Add Announcement</button>
    </div>
    <div class="tabs">
        <button class="tablink rounded-start" [class.active]="selectedTab == 'pending'" (click)="selectTab('pending')">Pending</button>
        <button class="tablink" [class.active]="selectedTab == 'approved'" (click)="selectTab('approved')">Approved</button>
        <button class="tablink rounded-end" [class.active]="selectedTab == 'rejected'" (click)="selectTab('rejected')">Rejected</button>
    </div>

</div>
