

<div class="container  mt-3">
<button (click)="openModal(popupmodal)" class="shifting btn  px-5 text-white mb-4 ">
  <img src="images/plus.svg" alt="+logo">Add Loan Type</button>
<table>
  <tr class="border-bottom">
    <th>Loan ID</th>
    <th>Loan Type</th>
    <th>Loan Description</th>
    <th>Actions</th>
   
  </tr>
  <tr *ngFor = "let l of loanData" class="border-bottom">
    <td>{{l.id}}</td>
    <td>{{l.loanType}}</td>
    <td>{{l.loanDescription}}</td>
  

  <td><button (click)="openModal(popupmodal,l.id)" class="btn  me-1 "> <img src="images/Edit 1.svg"  class="img-fluid" style="width: 25px; height: auto;" alt="edited image"></button>

    <button (click)="delete(l.id)" class="btn "><img src="images/Delete.svg" alt="deleted image" class="img-fluid" style="width: 25px; height: auto;"></button></td>
 
  </tr>

  </table>
  </div>

<ng-template #popupmodal let-modal>
    <div class="modal-header justify-content-between">
        <h5>Loan Master Form</h5>
        <span style="font-size: 25px;" (click)="modal.dismiss()"><img src="images/close.png"  class="img-fluid" style="width: 25px; height: auto;" alt="close"></span>
    </div>
    <div class="modal-body">
        <app-loan-type-form [editid]="editid" (closemodal)="close($event)"></app-loan-type-form>
    </div>
    <div class="modal-footer">

    </div>
</ng-template>
