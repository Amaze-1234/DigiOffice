<div class="card">
  <div class="card-body">
    <div class="intial">
      <img src="images/filter.png" alt="icon" width="18px" height="18px">
      <p id="filter-text">Filter By:</p>
      <input type="text" placeholder="Search.." style="padding:2px;" class="form-control" [(ngModel)]="searchItem">
    </div>
    <div class="addDetails">
      <button id="addButton" (click)="openModal(popupmodel1)"> <img src="images/plus.svg" width="15px"> Add Department
      </button>
    </div>
  </div>
</div>
<p class="records">Showing {{(departmentData|search:searchItem).length}} Results</p>

<table class="table ">

  <tr>
    <th>Department Name</th>
    <th>Department Description</th>
    <th>Actions</th>
  </tr>
  <tr *ngFor="let data of departmentData|search:searchItem  let i= index">
    <td>{{data.departmentName}}</td>
    <td>{{data.departmentDescription}}</td>
  

    <td>
      <img class="modify" src="images/Edit 1.svg" alt="Edit" (click)="openModal(popupmodel1,data.id)">
      <img class="modify" src="images/Delete.svg" alt="Delete" (click)="deleteDepartment(data.id)">
    </td>
  </tr>
</table>

<ng-template #popupmodel1>
  <div class="modal-header justify-content-between fw-bold">
    <h3>Department Master</h3>
    <span><img src="images/close.png" alt="close.png" (click)="close()"></span>
  </div>
  <div class="modal-body">
    <app-department-form [deptID]="deptID" (closeModal)="close($event)"></app-department-form>
  </div>


</ng-template>
